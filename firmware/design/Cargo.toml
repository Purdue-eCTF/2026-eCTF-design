[package]
name = "design"
version = "0.1.0"
edition = "2024"

[dependencies]
bytemuck = { version = "1.25.0", default-features = false, features = [
    "derive",
    "min_const_generics",
] }
argon2 = { version = "0.5.3", default-features = false }
blake2 = { version = "0.10.6", default-features = false }
chacha20poly1305 = { version = "0.10.1", default-features = false }

cortex-m = "0.7.7"
cortex-m-rt = { version = "0.7.2", default-features = false, features = [
    # "set-sp",
    # "set-vtor",
    "device",
] }

mspm0l222x-hal = { git = "https://github.com/Purdue-eCTF/mspm0l222x-hal.git", features = [
    "rt",
] }
thiserror = { version = "2.0.18", default-features = false }
x25519-dalek = { version = "2.0.1", default-features = false, features = [
    "static_secrets",
    "precomputed-tables",
] }

ed25519-dalek = { version = "2.2.0", default-features = false, features = [
    "digest",
    "hazmat",
    "fast",
] }
common = { path = "../common" }
subtle = { version = "2.6.1", default-features = false, features = [
    "const-generics",
    "nightly",
] }
design_macros = { path = "../design_macros" }
# mspm0l222x-hal = { path = "../mspm0l222x-hal", features = ["rt"] }

[build-dependencies]
bytemuck = { version = "1.25.0", features = ["derive"] }
serde = { version = "1.0.217", features = ["serde_derive"] }
serde_json = "1.0.137"
argon2 = "0.5.3"
blake2 = "0.10.6"
ed25519-dalek = { version = "2.1.1", default-features = false }
x25519-dalek = { version = "2.0.1", default-features = false, features = [
    "static_secrets",
] }
common = { path = "../common" }
chacha20poly1305 = { version = "0.10.1", default-features = false, features = [
    "rand_core",
    "getrandom",
] }
rand = { version = "0.10.0", default-features = false, features = [
    "thread_rng",
] }

[profile.release]
lto = "fat"
opt-level = "s"
debug = true
overflow-checks = true
panic = "abort"

[profile.release.package."*"]
overflow-checks = false
opt-level = 3
