[build]
target = "thumbv6m-none-eabi"

[unstable]
profile-rustflags = true


[target.thumbv6m-none-eabi]
rustflags = [
    "-C",
    "linker=./randomized_linker.py",
    "-C",
    "linker-flavor=gcc",
    "-Z",
    # https://doc.rust-lang.org/beta/nightly-rustc/rustc_target/spec/enum.StackProtector.html (stack protecter levels)
    "stack-protector=strong",
    "-C",
    "link-arg=-nostartfiles",
    "-C",
    "link-arg=-Tlink.x",
    "-Wlinker-messages",
]
runner = ["sh", "run.sh"]
