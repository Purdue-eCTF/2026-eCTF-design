name: Build

on:
  push:
    branches:
      - main
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened]


jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.x"
          cache: "pip" # Optional: Caches dependencies for faster subsequent runs

      - name: Install pyzmq
        run: |
          python -m pip install --upgrade pip
          pip install pyzmq

      - name: Run
        env:
          PYTHONUNBUFFERED: 1
          AUTH_TOKEN: ${{ secrets.AUTH_TOKEN }}
          IP: ${{ secrets.IP }}
          BUILD_PORT: ${{ secrets.BUILD_PORT }}
          BUILD_LOG_PORT: ${{ secrets.BUILD_LOG_PORT }}
          TEST_LOG_PORT: ${{ secrets.TEST_LOG_PORT }}
          ACTOR: ${{ github.actor }}
          BRANCH: ${{ github.head_ref || github.ref_name }} # https://github.com/orgs/community/discussions/30794
          COMMIT_HASH: ${{ github.event.pull_request.head.sha || github.sha }} # https://github.com/orgs/community/discussions/26676  
        run: python upload.py "$COMMIT_HASH" "$ACTOR" "$(git show -s --format=%s "$COMMIT_HASH")" '${{ github.run_id }}' "$BRANCH"
