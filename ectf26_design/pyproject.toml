[build-system]
requires = ["uv_build>=0.9.15,<0.10.0"]
build-backend = "uv_build"

[project]
name = "ectf26_design"
version = "2026.0.1+purdue1"
requires-python = ">=3.12"

dependencies = ["loguru"]

[project.scripts]
secrets = "ectf26_design.gen_secrets:main"

[tool.ruff]
target-version = "py312"
unsafe-fixes = true

[tool.ruff.lint]
preview = true

[tool.ruff.format]
preview = true
