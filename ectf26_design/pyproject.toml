[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ectf26_design"
version = "2026.0.1+purdue1"
requires-python = ">=3.12"

dependencies = [
    "loguru",
    "pycryptodome>=3.23.0"
]

[project.scripts]
secrets = "gen_secrets:main"

[tool.ruff]
target-version = "py312"
unsafe-fixes = true

[tool.ruff.lint]
preview = true

[tool.ruff.format]
preview = true
